name: Receber áudio e transcrever

# A skill envia o MP3 para o branch "inbox" (commit único, force-push) com:
#   inbox/<tag>.mp3   ex.: inbox/ep-002.mp3
# Este workflow cria o release em rascunho com o MP3 e grava a transcrição em main.

on:
  push:
    branches: [inbox]

permissions:
  contents: write

jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inbox
          path: inbox-branch
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Criar release em rascunho
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          f=$(ls inbox-branch/inbox/*.mp3 | head -1)
          tag=$(basename "$f" .mp3)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$f" --clobber
          else
            n=$((10#${tag#ep-}))
            gh release create "$tag" "$f" --draft --title "Episódio $n" --notes "Aguardando título e descrição." --target main
          fi
      - run: pip install faster-whisper requests
      - name: Transcrever
        env:
          AUDIO: ${{ steps.rel.outputs.file }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          python - <<'EOF'
          import os
          from faster_whisper import WhisperModel
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segments, _ = model.transcribe(os.environ["AUDIO"], language="pt", vad_filter=True)
          text = "\n".join(s.text.strip() for s in segments)
          path = f"main/transcripts/{os.environ['TAG']}.txt"
          open(path, "w", encoding="utf-8").write(text + "\n")
          EOF
      - name: Commit
        working-directory: main
        run: |
          git config user.name "evangelho-bot"
          git config user.email "actions@users.noreply.github.com"
          git add transcripts
          git commit -m "transcrição: ${{ steps.rel.outputs.tag }}"
          git pull --rebase
          git push
