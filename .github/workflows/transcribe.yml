name: Transcrever áudio

# Único passo no GitHub: transcreve audio/ep-NNN.mp3 novos (o modelo de voz não baixa no ambiente do Claude).
# Título, descrição, feed e publicação são feitos pelo Claude.

on:
  push:
    branches: [main]
    paths: ["audio/*.mp3", ".github/workflows/transcribe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install faster-whisper requests numpy
      - name: Transcrever
        run: |
          python - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel
          todo = [p for p in sorted(Path("audio").glob("ep-*.mp3")) if not Path(f"transcripts/{p.stem}.txt").exists()]
          if todo:
              model = WhisperModel("small", device="cpu", compute_type="int8")
          for p in todo:
              import subprocess, numpy as np
              raw = subprocess.run(["ffmpeg", "-loglevel", "error", "-i", str(p), "-ac", "1", "-ar", "16000", "-f", "f32le", "-"], check=True, capture_output=True).stdout
              audio = np.frombuffer(raw, dtype=np.float32)
              segments, _ = model.transcribe(audio, language="pt", vad_filter=True)
              Path(f"transcripts/{p.stem}.txt").write_text("\n".join(s.text.strip() for s in segments) + "\n", encoding="utf-8")
              print("ok", p.stem)
          PY
      - name: Commit
        run: |
          git config user.name "evangelho-bot"
          git config user.email "actions@users.noreply.github.com"
          git add transcripts
          git diff --cached --quiet && exit 0
          git commit -m "transcrição automática"
          git pull --rebase
          git push
