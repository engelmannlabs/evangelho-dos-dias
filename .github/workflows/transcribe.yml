name: Transcrever episódio

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release em rascunho (ex.: ep-002)"
        required: true

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install faster-whisper==1.1.1
      - name: Baixar áudio
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --pattern '*.mp3' --dir /tmp/ep
      - name: Transcrever
        run: |
          python - <<'EOF'
          import glob
          from faster_whisper import WhisperModel
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segments, _ = model.transcribe(glob.glob("/tmp/ep/*.mp3")[0], language="pt", vad_filter=True)
          text = "\n".join(s.text.strip() for s in segments)
          open("transcripts/${{ inputs.tag }}.txt", "w", encoding="utf-8").write(text + "\n")
          EOF
      - name: Commit
        run: |
          git config user.name "evangelho-bot"
          git config user.email "actions@users.noreply.github.com"
          git add transcripts
          git commit -m "transcrição: ${{ inputs.tag }}"
          git pull --rebase
          git push
