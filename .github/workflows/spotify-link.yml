name: Buscar link no Spotify

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar pendências
        id: check
        run: |
          n=$(python3 -c "import json;print(sum(1 for e in json.load(open('episodes.json')) if not e.get('spotify_url')))")
          echo "pending=$n" >> "$GITHUB_OUTPUT"
      - name: Consultar Spotify
        if: steps.check.outputs.pending != '0'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_SHOW_ID: ${{ vars.SPOTIFY_SHOW_ID }}
        run: python3 scripts/spotify_links.py
      - name: Atualizar página e release
        if: steps.check.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_feed.py
          python3 - <<'EOF'
          import json, subprocess
          for e in json.load(open("episodes.json")):
              if not e.get("spotify_url"):
                  continue
              body = subprocess.run(["gh", "release", "view", e["tag"], "--json", "body", "-q", ".body"], capture_output=True, text=True).stdout
              if "open.spotify.com" not in body:
                  subprocess.run(["gh", "release", "edit", e["tag"], "--notes", body.rstrip() + f"\n\n🎧 Spotify: {e['spotify_url']}"], check=True)
          EOF
          git config user.name "evangelho-bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes.json podcast.json docs
          git diff --cached --quiet || (git commit -m "spotify: links atualizados" && git push)
