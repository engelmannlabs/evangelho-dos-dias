name: Publicar episódio

# Dispara quando a skill grava episodes/<tag>.json em main com {"title": ..., "description": ...}.
# Publica o release (sai do rascunho), registra o episódio e regera o feed.

on:
  push:
    branches: [main]
    paths: ["episodes/*.json", "podcast.json", "scripts/build_feed.py"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mutagen
      - name: Publicar releases e registrar episódios
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_episodes.py
      - name: Gerar feed
        run: python scripts/build_feed.py
      - name: Commit
        run: |
          git config user.name "evangelho-bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes.json docs
          git diff --cached --quiet || git commit -m "feed: atualizado"
          git pull --rebase
          git push
      - name: Disparar busca do link no Spotify
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run spotify-link.yml || true
